<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Users</title>
</head>
<body>
    <h1>Users</h1>
    <ul>
        {% for usuario in usuarios %}
            <li><a href="/usuarios/{{ usuario.id }}">{{ usuario.nombre }}</a> - {{ usuario.email }}</li>
        {% endfor %}
<div class="back-link">
        <a href="/">Volver a la página principal</a>
</div>
    </ul>
</body>
</html>
